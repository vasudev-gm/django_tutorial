# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/


services:
  angie:
    build:
      context: ./angie
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./angie/angie.conf:/etc/angie/angie.conf:ro
      - static_volume:/usr/share/angie/html/static
      - media_volume:/usr/share/angie/html/media
      - angie_acme:/var/lib/angie/acme
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "angie", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
    expose:
      - 8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    environment:
      - GUNICORN_WORKERS=4
      - GUNICORN_THREADS=2
      - GUNICORN_WORKER_CLASS=gthread
      - GUNICORN_MAX_REQUESTS=1000
      - GUNICORN_MAX_REQUESTS_JITTER=50
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  angie_acme:
  static_volume:
  media_volume:

