load_module modules/ngx_http_zstd_filter_module.so;
load_module modules/ngx_http_zstd_static_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/angie/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    acme_client letsencrypt https://acme-v02.api.letsencrypt.org/directory email=django@example.com;

    upstream django_app {
        zone django_app 64k;
        server web:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
        ip_hash;
    }

    server {
        listen 80;
        server_name api.example.com;
        acme letsencrypt;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.example.com;
        acme letsencrypt;

        ssl_certificate $acme_cert_letsencrypt;
        ssl_certificate_key $acme_cert_key_letsencrypt;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        limit_req zone=mylimit burst=20 nodelay;

        location / {
            proxy_pass http://django_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/html
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/x-javascript
            application/json
            application/manifest+json
            application/ld+json
            application/graphql+json
            application/xml
            application/xml+rss;
        gzip_min_length 1000;

        zstd on;
        zstd_min_length 1000;
        zstd_comp_level 3;
        zstd_types
            text/html
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/x-javascript
            application/json
            application/manifest+json
            application/ld+json
            application/graphql+json
            application/xml
            application/xml+rss;

        add_header Vary Accept-Encoding;

        location /static/ {
            alias /usr/share/angie/html/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            gzip_static on;
            zstd_static on;
        }

        location /media/ {
            alias /usr/share/angie/html/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            gzip_static on;
            zstd_static on;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
